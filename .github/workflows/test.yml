name: Test

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly, for the buildbot check below: nothing in the repository can go
    # stale, but the libretro buildbot can.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where tests/fetch_assets.py puts the cores and ROMs, and where
  # tests/conftest.py looks for them.
  RETRO_TEST_ASSETS: ${{ github.workspace }}/test-assets

jobs:
  # Lint plus the whole fast suite: tables, layouts, archives, the cog
  # driven against fakes, and the property tests. No cores, no ROMs, no
  # network -- this is the job that should fail first when something is
  # wrong, and it takes well under a minute.
  #
  # requirements-dev.txt installs libretro.py here even though no core is
  # loaded, which is what lets tests/test_frame_grab.py run: it drives a real
  # ArrayVideoDriver with synthetic frames and asserts the cog's fast frame
  # grab is byte-identical to libretro.py's own screenshot(). The fast grab
  # reads private attributes, so a libretro.py release that renames or
  # relays them has to fail *here*, in seconds, rather than silently making
  # every clip a hundred times slower to record. That is also why the
  # dependency is unpinned.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the development dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run the fast tests
        # Red is not installed here, so tests/stubs stands in for it and the
        # handful of tests that need the real thing skip; the `red` job below
        # runs the same suite against a real Red-DiscordBot.
        run: pytest -m "not emulator and not network" --durations=10

  # The same fast suite against the real Red-DiscordBot, on the Python Red
  # runs. This is where the @pytest.mark.redbot tests (command permissions
  # and the like) actually execute, and where the cog's import is proved.
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Red-DiscordBot and the test tools
        run: pip install Red-DiscordBot pytest pytest-asyncio hypothesis pillow
      - name: Import the cog
        # retro.Retro is the module the cog class lives in; it was called
        # retro.RetroCog before the class was renamed to Retro.
        # `retro.Retro` is the cog class re-exported by retro/__init__.py, so
        # the module of the same name is imported through importlib.
        run: |
          python -c "
          import importlib, retro
          for name in ('retro.Retro', 'retro.RetroView', 'retro.systems', 'retro.archives'):
              importlib.import_module(name)
          assert retro.Retro.__name__ == 'Retro', retro.Retro.__name__
          print('cog class:', retro.Retro.__name__)
          "
      - name: Run the fast tests against the real Red
        run: pytest -m "not emulator and not network" --durations=10

  # The slow half: real libretro cores driving real ROMs, plus the one place
  # the cog itself is driven against a real core -- exporting µCity's 128 KiB
  # battery save, wiping it and importing it back. The cores and the
  # freely-distributable ROMs are cached between runs, so an unchanged core
  # list costs one cache restore instead of ~40 MiB of downloads.
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # libretro.py resolves to 0.6.x on Python 3.11 (what Red-DiscordBot
        # runs on) and to the latest release on Python 3.13.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the emulator dependencies
        # discord.py, but deliberately not Red: most of the emulator tests
        # exercise retro/emulator.py on its own, but the save export/import
        # round trip (tests/test_saves_roundtrip.py) drives the real cog
        # against a real core, and tests/stubs stands in for Red.
        run: pip install "libretro.py" pillow "discord.py" pytest pytest-asyncio pytest-xdist
      - name: Restore the cached cores and ROMs
        uses: actions/cache@v4
        with:
          path: test-assets
          # The core list lives in systems.py, so a new console invalidates
          # the cache; nothing else changes what is downloaded.
          key: retro-assets-linux-x86_64-${{ hashFiles('retro/systems.py', 'tests/fetch_assets.py') }}
          restore-keys: retro-assets-linux-x86_64-
      - name: Fetch anything the cache did not have
        run: python tests/fetch_assets.py
      - name: Run the emulator tests
        # One libretro core may be loaded per *process*, so -n (separate
        # processes) is safe and roughly halves this; threads would not be.
        run: pytest -m emulator -n 2 --durations=10

  # Does the buildbot still publish every core systems.py recommends? This
  # is the one check that can break without anybody touching the repository,
  # so it runs on master and on a weekly schedule rather than on every PR.
  buildbot:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pytest
        run: pip install pytest pytest-asyncio
      - name: Every recommended core exists on the buildbot
        env:
          RETRO_TEST_NETWORK: "1"
        run: pytest -m network --durations=10
