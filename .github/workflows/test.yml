name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile all Python sources
        run: python -m compileall assistantextras jackett retro
      - name: Validate the info.json files
        run: |
          for file in info.json */info.json; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null
          done
      - name: Check the console/core/button tables
        run: |
          python - <<'EOF'
          import importlib.util

          spec = importlib.util.spec_from_file_location("systems", "retro/systems.py")
          S = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(S)

          RETROPAD = {"b", "y", "select", "start", "up", "down", "left", "right",
                      "a", "x", "l", "r", "l2", "r2", "l3", "r3"}
          seen = {}
          for system in S.SYSTEMS:
              fields = system.fields
              assert set(fields) <= RETROPAD, (system.key, set(fields) - RETROPAD)
              assert len(set(fields)) == len(fields), f"{system.key} repeats a button"
              assert system.confirm in fields, f"{system.key} has no confirm button"
              # Row 0 is the d-pad and the row after the console's own rows is
              # Wait/repeat/Replay/Stop, so Discord's 5x5 grid allows 3 here.
              assert len(system.rows) <= 3, f"{system.key} needs too many rows"
              assert all(len(row) <= 5 for row in system.rows), f"{system.key} row too wide"
              for extension in system.extensions:
                  assert extension not in S.AMBIGUOUS_EXTENSIONS, extension
                  assert extension not in seen, f".{extension}: {seen[extension]} vs {system.key}"
                  seen[extension] = system.key
          assert S.system_for_extension(".GBC").key == "gb"
          assert S.system_for_extension("nes").core == "fceumm"
          assert S.system_for_extension("bin") is None
          assert S.core_name_from_filename("/x/snes9x_libretro.so") == "snes9x"
          print(f"OK: {len(S.SYSTEMS)} consoles, {len(S.CORES)} cores, {len(seen)} extensions")
          EOF

  cores:
    # The core names in systems.py have to match what the libretro buildbot
    # publishes, or [p]retroset download quietly installs nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Every recommended core exists on the buildbot
        run: |
          python - <<'EOF'
          import importlib.util
          import io
          import urllib.request
          import zipfile

          spec = importlib.util.spec_from_file_location("systems", "retro/systems.py")
          S = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(S)

          BASE = "https://buildbot.libretro.com/nightly/linux/x86_64/latest"
          total = 0
          for core in S.CORES:
              name = f"{core}_libretro.so"
              with urllib.request.urlopen(f"{BASE}/{name}.zip", timeout=120) as resp:
                  payload = resp.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  member = next(e for e in archive.namelist() if e.endswith(name))
                  size = archive.getinfo(member).file_size
              total += len(payload)
              print(f"OK {core:<20} {len(payload) // 1024:>5} KiB zip -> {size // 1024:>6} KiB core")
          print(f"{len(S.CORES)} cores, {total // 1024} KiB of downloads")
          EOF

  emulator-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # libretro.py resolves to 0.6.x on Python 3.11 (what Red-DiscordBot
        # runs on) and to the latest release on Python 3.13.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the emulator dependencies
        run: pip install "libretro.py" pillow
      - name: Download the Gambatte core
        run: |
          curl -fsSLO https://buildbot.libretro.com/nightly/linux/x86_64/latest/gambatte_libretro.so.zip
          unzip gambatte_libretro.so.zip
      - name: Download the dmg-acid2 test ROM
        run: curl -fsSLO https://github.com/mattcurrie/dmg-acid2/releases/download/v1.0/dmg-acid2.gb
      - name: Render a still frame
        run: python retro/emulator.py ./gambatte_libretro.so dmg-acid2.gb out.png 120
      - name: Check the screenshot
        run: |
          python - <<'EOF'
          from pathlib import Path

          from PIL import Image

          assert Path("out.png").is_file(), "out.png was not written"
          image = Image.open("out.png").convert("RGB")
          # The Game Boy's pixels are square, so 160x144 doubles to exactly
          # 320x288 once the core's reported aspect ratio is applied.
          assert image.size == (320, 288), f"Unexpected screenshot size: {image.size}"
          colors = image.getcolors(maxcolors=256 * 256 * 256)
          assert len(colors) >= 3, f"Expected at least 3 distinct colors, got {len(colors)}"
          print(f"OK: {image.size[0]}x{image.size[1]} with {len(colors)} distinct colors")
          EOF
      - name: Record a clip
        run: python retro/emulator.py ./gambatte_libretro.so dmg-acid2.gb out.webp 300
      - name: Check the clip
        run: |
          python - <<'EOF'
          from pathlib import Path

          from PIL import Image

          data = Path("out.webp").read_bytes()
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", data[:12]
          clip = Image.open("out.webp")
          assert clip.format == "WEBP", clip.format
          assert clip.size == (320, 288), clip.size
          assert clip.is_animated and clip.n_frames >= 2, clip.n_frames
          # loop=1 means "play through once", which is what the Replay button
          # exists for; loop=0 would flicker forever in a busy channel.
          assert clip.info.get("loop") == 1, clip.info.get("loop")
          print(f"OK: {len(data)} byte animated WebP, {clip.n_frames} frames, loop=1")
          EOF

  red-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Red-DiscordBot
        run: pip install Red-DiscordBot
      - name: Import the cogs
        run: python -c "import retro.RetroCog, retro.RetroView, retro.systems, jackett.JackettCog"
